# Template Secret untuk API key Gemini.
#
# JANGAN commit key asli! Cara pakai:
#   1. Copy file ini jadi  k8s/secret.yaml  (sudah masuk .gitignore)
#   2. Ganti nilai GEMINI_API_KEY dengan key asli Anda
#   3. Apply:  kubectl apply -f k8s/secret.yaml
#
# Alternatif tanpa file (lebih aman, langsung dari CLI):
#   kubectl create secret generic gemini-secret \
#     --namespace porto-lab \
#     --from-literal=GEMINI_API_KEY="ISI_KEY_ANDA"
apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: porto-lab
type: Opaque
stringData:
  GEMINI_API_KEY: "PASTE_YOUR_GEMINI_API_KEY_HERE"
