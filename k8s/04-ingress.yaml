# ============================================================
# INGRESS: satu pintu masuk dari luar -> arahkan ke Service yang tepat
# ============================================================
# Logikanya sama persis dengan vercel.json:
#   /api/*  -> backend  (port 8000)
#   /*      -> frontend (port 80)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: porto-ingress
  namespace: porto-lab
  annotations:
    # WAJIB untuk chat streaming: matikan buffering agar token muncul real-time.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: porto.local # daftarkan di /etc/hosts -> IP cluster (lihat README)
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
